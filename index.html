<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة الشهادات — الأكاديمية الوطنية للبيئة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gd:#143121;--gm:#327039;--gold:#f1be4a;--cream:#f8edd9;--org:#de5b35}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#eef2ee;min-height:100vh;direction:rtl}

nav{background:var(--gd);height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;box-shadow:0 2px 12px rgba(0,0,0,0.18)}
.nav-logo{height:44px;width:auto}
.nav-left{display:flex;align-items:center;gap:24px}
.nav-title{font-size:15px;color:rgba(255,255,255,0.6)}
.lang-sw{display:flex;background:rgba(255,255,255,0.1);border-radius:8px;padding:3px;gap:2px}
.lb{padding:5px 14px;border-radius:6px;font-size:13px;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,0.55);transition:.15s;font-weight:500}
.lb.on{background:var(--gold);color:var(--gd);font-weight:700}

.hero{background:var(--gd);padding:52px 40px 80px;text-align:center;position:relative}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:48px;background:#eef2ee;border-radius:48px 48px 0 0}
.hero h1{font-size:28px;color:#fff;margin-bottom:10px;font-weight:700}
.hero p{font-size:15px;color:rgba(255,255,255,0.65);max-width:480px;margin:0 auto;line-height:1.7}

.form-wrap{max-width:520px;margin:-20px auto 0;padding:0 20px 48px;position:relative;z-index:2}
.form-card{background:#fff;border-radius:16px;padding:36px;box-shadow:0 8px 40px rgba(20,49,33,0.12)}

.step-label{font-size:12px;color:var(--gm);font-weight:700;letter-spacing:1px;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.step-label::after{content:'';flex:1;height:1px;background:#e8e8e8}

.field{margin-bottom:18px}
.field label{display:block;font-size:13px;color:#555;margin-bottom:7px;font-weight:600}
.field input{width:100%;padding:13px 16px;border:1.5px solid #e4e4e4;border-radius:10px;font-size:15px;color:#1a1a1a;background:#fafafa;outline:none;transition:.2s;direction:rtl;text-align:right;font-family:inherit}
.field input:focus{border-color:var(--gm);background:#fff;box-shadow:0 0 0 3px rgba(50,112,57,0.1)}

.btn-main{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s;margin-top:6px;font-family:inherit}
.btn-green{background:var(--gm);color:#fff}
.btn-green:hover{background:var(--gd)}
.btn-green:disabled{opacity:0.55;cursor:not-allowed}
.btn-gold{background:var(--gold);color:var(--gd)}
.btn-gold:hover{filter:brightness(0.93)}
.btn-gold:disabled{opacity:0.55;cursor:not-allowed}

/* شهادات متعددة */
.certs-section{margin-top:22px;display:none}
.certs-section.show{display:block}
.certs-title{font-size:13px;color:#666;margin-bottom:12px;font-weight:600}
.cert-item{border:1.5px solid #e4e4e4;border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cert-item:hover{border-color:var(--gm);background:#f7fbf8}
.cert-item.selected{border-color:var(--gm);background:var(--cream);border-width:2px}
.cert-name{font-size:15px;color:var(--gd);font-weight:600;margin-bottom:3px}
.cert-course{font-size:13px;color:var(--gm)}
.cert-check{width:22px;height:22px;border-radius:50%;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s;font-size:13px}
.cert-item.selected .cert-check{background:var(--gm);border-color:var(--gm);color:#fff}

.btn-dl{margin-top:14px;display:none}
.btn-dl.show{display:block}

.err{background:#fff4f2;border:1.5px solid rgba(222,91,53,0.2);border-radius:10px;padding:14px 18px;font-size:14px;color:var(--org);margin-top:16px;display:none;text-align:center;line-height:1.6}
.err.show{display:block}

.loading{text-align:center;padding:28px 0;display:none}
.loading.show{display:block}
.spinner{width:36px;height:36px;border:3px solid #e0e0e0;border-top-color:var(--gm);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:14px;color:#888}

footer{background:var(--gd);padding:24px 40px;text-align:center;margin-top:48px}
footer span{font-size:13px;color:rgba(255,255,255,0.4)}
footer .gold{color:var(--gold)}
</style>
</head>

<div class="hero">
  <h1 id="h1">استخرج شهادتك الآن</h1>
  <p id="hp">أدخل بياناتك للتحقق من مشاركتك واستخراج شهادتك الرسمية</p>
</div>

<div class="form-wrap">
  <div class="form-card">

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="load-txt">جارٍ تحميل البيانات...</p>
    </div>

    <div id="form-body" style="display:none">
      <div class="step-label" id="step-lbl">أدخل بياناتك</div>

      <div class="field">
        <label id="ln">الاسم الكامل</label>
        <input type="text" id="fn" placeholder="مثال: أحمد محمد العتيبي" oninput="resetState()">
      </div>
      <div class="field">
        <label id="lp">رقم الجوال</label>
        <input type="tel" id="fp" placeholder="05XXXXXXXX" oninput="resetState()">
      </div>

      <button class="btn-main btn-green" onclick="verify()">
        <span id="bvt">تحقق واستخرج شهادتي</span>
      </button>

      <!-- قائمة الشهادات -->
      <div class="certs-section" id="certs-section">
        <div class="certs-title" id="certs-title">اختر الشهادة التي تريد تحميلها:</div>

async function loadData() {
  document.getElementById('loading').classList.add('show');
  try {
    const res = await fetch(CSV_URL);
    const csv = await res.text();
    DATA = parseCSV(csv);
    document.getElementById('loading').classList.remove('show');
    document.getElementById('form-body').style.display = 'block';
  } catch(e) {
    document.getElementById('load-txt').textContent = 'تعذّر تحميل البيانات. تحقق من الاتصال.';
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQ = !inQ; }
      else if (line[i] === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
      else { cur += line[i]; }
    }
    vals.push(cur.trim());
    const obj = {};
    headers.forEach((h,i) => { obj[h] = (vals[i]||'').replace(/^"|"$/g,'').trim(); });
    return obj;
  });
}

function setLang(l) {
  lang = l;
  document.getElementById('lb-ar').classList.toggle('on', l==='ar');
  document.getElementById('lb-en').classList.toggle('on', l==='en');
  document.documentElement.dir = l==='ar'?'rtl':'ltr';
  document.documentElement.lang = l;
  const t = T[l];
  document.getElementById('nav-title').textContent = t.navT;
  document.getElementById('h1').textContent = t.h1;
  document.getElementById('hp').textContent = t.hp;
  document.getElementById('ln').textContent = t.ln;
  document.getElementById('fn').placeholder = t.phN;
  document.getElementById('lp').textContent = t.lp;
  document.getElementById('fp').placeholder = t.phP;
  document.getElementById('bvt').textContent = t.bv;
  document.getElementById('bdlt').textContent = t.bdl;
  document.getElementById('certs-title').textContent = t.certsTitle;
  document.getElementById('errt').textContent = t.err;
  const fi = document.getElementById('fn');
  fi.style.direction = l==='ar'?'rtl':'ltr';
  fi.style.textAlign = l==='ar'?'right':'left';
  resetState();
}

function resetState() {
  selectedRecord = null;
  document.getElementById('certs-section').classList.remove('show');
  document.getElementById('bdl').classList.remove('show');
  document.getElementById('bdl').disabled = true;
  document.getElementById('err').classList.remove('show');
  document.getElementById('certs-list').innerHTML = '';
}

function norm(s){ return s.trim().replace(/\s+/g,' '); }

function verify() {
  const name = norm(document.getElementById('fn').value);
  const phone = norm(document.getElementById('fp').value);
  resetState();
  if (!name || !phone) return;

  const nk = Object.keys(DATA[0]||{}).find(k=>k.includes('الاسم'));
  const pk = Object.keys(DATA[0]||{}).find(k=>k.includes('هاتف')||k.includes('جوال'));

  // جمع كل سجلات هذا الشخص
  const matches = DATA.filter(r => norm(r[nk]||'')===name && norm(r[pk]||'')===phone);

  if (!matches.length) {
    document.getElementById('err').classList.add('show');
    return;
  }

  // بناء قائمة الشهادات
  const ck = Object.keys(matches[0]).find(k=>k.includes('ورشة')||k.includes('برنامج'));
  const list = document.getElementById('certs-list');
  list.innerHTML = '';

  matches.forEach((rec, i) => {
    const course = rec[ck]||'';
    const div = document.createElement('div');
    div.className = 'cert-item';
    div.innerHTML = `
      <div>
        <div class="cert-name">${rec[nk]}</div>
        <div class="cert-course">${course}</div>
      </div>
      <div class="cert-check" id="chk-${i}">✓</div>
    `;
    div.onclick = () => selectCert(div, rec, i, matches.length);
    list.appendChild(div);
  });

  document.getElementById('certs-section').classList.add('show');
  document.getElementById('bdl').classList.add('show');

  // لو شهادة واحدة فقط — اختارها تلقائياً
  if (matches.length === 1) {
    selectCert(list.firstChild, matches[0], 0, 1);
  }
}

function selectCert(el, rec, idx, total) {
  document.querySelectorAll('.cert-item').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedRecord = rec;
  document.getElementById('bdl').disabled = false;
}

function loadScript(src){
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
}

async function downloadPDF() {
  if (!selectedRecord) return;
  const nk = Object.keys(selectedRecord).find(k=>k.includes('الاسم'));
  const ck = Object.keys(selectedRecord).find(k=>k.includes('ورشة')||k.includes('برنامج'));
  const name = selectedRecord[nk]||'';
  const course = selectedRecord[ck]||'';
  const btn = document.getElementById('bdl');
  btn.textContent = T[lang].genTxt;
  btn.disabled = true;
  try {
    if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const W=297,H=210;
    doc.setFillColor(248,237,217);
    doc.rect(0,0,W,H,'F');
    doc.setDrawColor(20,49,33);
    doc.setLineWidth(4);
    doc.rect(8,8,W-16,H-16,'S');
    doc.setDrawColor(241,190,74);
    doc.setLineWidth(1);
    doc.rect(13,13,W-26,H-26,'S');
    const img = new Image();
    img.src = LOGO_B64;
    await new Promise(r=>{img.onload=r;img.onerror=r});
    const lw=72,lh=29;
    doc.addImage(img,'PNG',(W-lw)/2,16,lw,lh,'','FAST');
    doc.setFont('helvetica','bold');
    doc.setFontSize(30);
    doc.setTextColor(50,112,57);
    doc.text('شهادة حضور',W/2,55,{align:'center'});
    doc.setDrawColor(241,190,74);
    doc.setLineWidth(0.8);
    doc.line(W*0.28,60,W*0.72,60);
    doc.setFont('helvetica','normal');
    doc.setFontSize(14);
    doc.setTextColor(20,49,33);
    doc.text('تشهد الأكاديمية الوطنية للبيئة بأن',W/2,74,{align:'center'});
    doc.setFont('helvetica','bold');
    doc.setFontSize(22);
    doc.setTextColor(50,112,57);
    doc.text('الأستاذ / '+name,W/2,88,{align:'center'});
    doc.setFont('helvetica','normal');
    doc.setFontSize(14);
    doc.setTextColor(20,49,33);
    doc.text('قد أتمَ بنجاح جميع متطلبات دورة',W/2,100,{align:'center'});
    doc.setFont('helvetica','bold');
    doc.setFontSize(18);
    doc.setTextColor(190,117,23);
    doc.text(course,W/2,113,{align:'center'});
    doc.setFont('helvetica','normal');
    doc.setFontSize(13);
    doc.setTextColor(20,49,33);
    doc.text('مع تمنياتنا بالتوفيق الدائم',W/2,125,{align:'center'});
    doc.setDrawColor(20,49,33);
    doc.setLineWidth(0.4);
    doc.line(W*0.38,H-30,W*0.62,H-30);
    doc.setFontSize(11);
    doc.text('مدير الأكاديمية الوطنية للبيئة',W/2,H-20,{align:'center'});
    doc.save('شهادة_'+name+'.pdf');
  } catch(e) {
    alert('حدث خطأ. تأكد من الاتصال بالإنترنت.');
  } finally {
    btn.textContent = T[lang].bdl;
    btn.disabled = false;
  }
}

loadData();
</script>
</body>
</html>
